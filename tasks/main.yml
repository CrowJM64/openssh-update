---
# tasks file for ssh-update
- name: Update OpenSSH (RedHat)
  ansible.builtin.package:
    name:
      - openssh
      - openssh-server
      - openssh-clients
    state: latest # noqa package-latest
#    update_only: "{{ rh_update_only }}"
  notify: Restart sshd (RedHat+Suse)
  when:
    - ansible_facts['os_family'] == "RedHat"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - ansible_facts['os_family'] == "Debian"

- name: Update OpenSSH (Debian)
  ansible.builtin.apt:
    name:
      - openssh-server
      - openssh-client
    state: latest # noqa package-latest
  notify: Restart ssh (Debian)
  when:
    - ansible_facts['os_family'] == "Debian"

- name: Update OpenSSH (Suse)
  community.general.zypper:
    name:
      - openssh
      - openssh-server
      - openssh-clients
    state: latest # noqa package-latest
  notify: Restart sshd (RedHat+Suse)
  when:
    - ansible_facts['os_family'] == "Suse"

