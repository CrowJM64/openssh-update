---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check SSHD service is active (RedHat+Suse)
      ansible.builtin.systemd:
        name: sshd
      register: sshd_svc
      failed_when: sshd_svc.status.ActiveState != "active"
      when:
        - ansible_facts['os_family'] in ["RedHat", "Suse"]

    - name: Check SSH service is active (Debian)
      ansible.builtin.systemd:
        name: ssh
      register: ssh_svc
      failed_when: ssh_svc.status.ActiveState != "active"
      when:
        - ansible_facts['os_family'] == "Debian"

    - name: Check SSH version is latest available (RedHat)
      ansible.builtin.dnf:
        name:
          - openssh
          - openssh-server
          - openssh-clients
        state: latest # noqa package-latest
      check_mode: true
      when:
        - ansible_facts['os_family'] == "RedHat"
      register: sshd_ver_rhel

    - name: Check SSH version is latest available (Debian)
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: latest # noqa package-latest
      check_mode: true
      when:
        - ansible_facts['os_family'] == "Debian"
      register: sshd_ver_deb

    - name: Check SSH version is latest available (Suse)
      community.general.zypper:
        name:
          - openssh
          - openssh-server
          - openssh-clients
        state: latest # noqa package-latest
      check_mode: true
      when:
        - ansible_facts['os_family'] == "Suse"
      register: sshd_ver_suse

    - name: Assert no updates available (RHEL)
      ansible.builtin.assert:
        that: not sshd_ver_rhel.changed
      when:
        - ansible_facts['os_family'] == "RedHat"

    - name: Assert no updates available (Debian)
      ansible.builtin.assert:
        that: not sshd_ver_deb.changed
      when:
        - ansible_facts['os_family'] == "Debian"

    - name: Assert no updates available (Suse)
      ansible.builtin.assert:
        that: not sshd_ver_suse.changed
      when:
        - ansible_facts['os_family'] == "Suse"